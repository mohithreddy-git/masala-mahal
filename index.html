    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Lora', Georgia, serif;
        background-color: #FDF3E3;
        background-image:
          radial-gradient(ellipse 110% 90% at 50% 0%, rgba(232,133,10,0.09) 0%, transparent 60%),
          linear-gradient(160deg, #fdf3e3 0%, #f9edd5 50%, #fdf3e3 100%);
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
        position: relative;
      }

      #loading-splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(160deg, #4A0F0F 0%, #6B1A1A 55%, #8C2424 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 20px;
        transition: opacity 0.4s ease;
      }

      #loading-splash::before {
        content: '';
        position: absolute;
        width: min(320px, 80vw);
        height: min(320px, 80vw);
        border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(201,148,42,0.12) 0deg 20deg,
          transparent 20deg 40deg
        );
        animation: rotateSlow 20s linear infinite;
      }

      @keyframes rotateSlow { to { transform: rotate(360deg); } }

      .splash-diya {
        font-size: clamp(3.5rem, 12vw, 5rem);
        animation: diGlow 2s ease-in-out infinite alternate;
        position: relative;
        z-index: 1;
      }

      @keyframes diGlow {
        from { filter: drop-shadow(0 0 10px rgba(232,133,10,0.5)); transform: scale(1); }
        to   { filter: drop-shadow(0 0 28px rgba(245,217,139,0.8)); transform: scale(1.06); }
      }

      .splash-title {
        font-family: Georgia, serif;
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        font-weight: 700;
        color: #F5D98B;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 16px rgba(0,0,0,0.4);
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 0 20px;
      }

      .splash-subtitle {
        font-size: clamp(0.7rem, 2.5vw, 0.85rem);
        font-weight: 600;
        color: rgba(221,195,125,0.65);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
        text-align: center;
        font-family: sans-serif;
      }

      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(245,217,139,0.2);
        border-top-color: #F5D98B;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        position: relative;
        z-index: 1;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .splash-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(200px, 60vw);
        position: relative;
        z-index: 1;
      }

      .splash-divider-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201,148,42,0.6), transparent);
      }

      .splash-divider-icon { color: #C9942A; font-size: 0.9rem; }
    </style>
  </head>

  <body>
    <div id="loading-splash" aria-hidden="true">
      <div class="splash-diya">🥘</div>
      <div class="splash-title">Masala Mahal</div>
      <div class="splash-divider">
        <span class="splash-divider-line"></span>
        <span class="splash-divider-icon">✦</span>
        <span class="splash-divider-line"></span>
      </div>
      <div class="splash-subtitle">Indian Food Quiz</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
  (function () {
    let splashTimeout;
    let isLoaded = false;
    
    function hideSplash() {
      const el = document.getElementById('loading-splash');
      if (!el) return;
      
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
      setTimeout(() => {
        if (el && el.parentNode) el.remove();
      }, 400);
    }
    
    // Hide splash after 4 seconds max (prevents infinite loading)
    splashTimeout = setTimeout(hideSplash, 4000);
    
    // Hide when React loads
    window.addEventListener('load', () => {
      clearTimeout(splashTimeout);
      setTimeout(hideSplash, 300);
    });
    
    // Also hide when DOMContentLoaded (faster)
    document.addEventListener('DOMContentLoaded', () => {
      clearTimeout(splashTimeout);
      setTimeout(hideSplash, 500);
    });
    
    // Mobile PWA fix - hide on first interaction
    ['click', 'touchstart', 'keydown'].forEach(event => {
      document.addEventListener(event, () => {
        if (!isLoaded) {
          isLoaded = true;
          clearTimeout(splashTimeout);
          hideSplash();
        }
      }, { once: true });
    });
  })();
</script>
  </body>
</html>
